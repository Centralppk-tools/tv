<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema PWA</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background-color: #0f1117;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .search-box {
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
    }
    input {
      padding: 12px 18px;
      font-size: 18px;
      border-radius: 8px;
      border: 2px solid #333;
      background: #1a1d26;
      color: #fff;
      outline: none;
      flex: 1;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    :focus {
      outline: 4px solid #38bdf8 !important;
      transform: scale(1.02);
      transition: transform 0.15s ease;
    }
    #player-container {
      width: 100%;
      height: 75vh;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    #player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94a3b8;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="search-box">
    <input
      type="text"
      id="movie-query"
      placeholder="Введите название фильма или ID Кинопоиска..."
      value="Интерстеллар"
      tabindex="1"
    >
    <button id="search-btn" tabindex="2">Найти и смотреть</button>
  </div>

  <div id="player-container">
    <div class="status">Загрузка...</div>
  </div>

  <script>
    const KINOMIX_BASE = 'https://kinomix.web.app';
    const searchBtn = document.getElementById('search-btn');
    const inputField = document.getElementById('movie-query');
    const playerContainer = document.getElementById('player-container');

    function buildPlayerUrl(query) {
      const value = query.trim();
      const kinopoiskId = Number(value);

      if (/^\d+$/.test(value) && kinopoiskId > 9999) {
        return `${KINOMIX_BASE}/embed/${kinopoiskId}`;
      }

      return `${KINOMIX_BASE}/search?query=${encodeURIComponent(value)}`;
    }

    function loadMovie(title) {
      const url = buildPlayerUrl(title);

      playerContainer.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.title = 'Видеоплеер';
      iframe.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = 'no-referrer-when-downgrade';
      playerContainer.appendChild(iframe);
    }

    function handleSearch() {
      const title = inputField.value.trim();
      if (!title) {
        playerContainer.innerHTML = '<div class="status">Введите название фильма или ID Кинопоиска</div>';
        return;
      }
      loadMovie(title);
    }

    searchBtn.addEventListener('click', handleSearch);
    inputField.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        handleSearch();
      }
    });

    loadMovie(inputField.value);
  </script>
</body>
</html>
